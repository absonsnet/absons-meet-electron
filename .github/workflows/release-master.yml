name: Build and Release ABSONS Meet

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-dist
            build_command: npx electron-builder --mac --publish never
          - os: windows-latest
            artifact_name: windows-dist
            build_command: npx electron-builder --win --x64 --publish never
          - os: ubuntu-latest
            artifact_name: linux-dist
            build_command: npx electron-builder --linux --x64 --arm64 --publish never

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npm run generate-icons

      - name: Build app bundles
        run: npm run build

      - name: Build platform artifacts
        run: ${{ matrix.build_command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          path: release-assets
          merge-multiple: true

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -e 'console.log(require("./package.json").version)')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          TITLE="ABSONS Meet ${VERSION} build ${GITHUB_RUN_NUMBER}"

          mapfile -t FILES < <(find release-assets -type f | sort)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --title "$TITLE" \
            --notes "Automated ABSONS Meet release build from master run ${GITHUB_RUN_NUMBER}."
