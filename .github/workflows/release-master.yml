name: Build and Release ABSONS Meet

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: macos-dist
            build_command: npx electron-builder --mac --publish never
          - os: windows-latest
            artifact_name: windows-dist
            build_command: npx electron-builder --win --x64 --publish never
          - os: ubuntu-latest
            artifact_name: linux-dist
            build_command: npx electron-builder --linux --x64 --arm64 --publish never

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npm run generate-icons

      - name: Validate package version
        run: npm run check-version

      - name: Build app bundles
        run: npm run build

      - name: Build platform artifacts
        run: ${{ matrix.build_command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/*.rpm
            dist/*.snap
            dist/*.tar.gz
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-dist'
          path: release-assets
          merge-multiple: true

      - name: Validate package version
        run: npm run check-version

      - name: Read package version
        id: version
        run: |
          VERSION=$(node -e 'console.log(require("./package.json").version)')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare stable release assets
        run: |
          mkdir -p stable-release-assets

          echo "Downloaded release artifacts:"
          find release-assets -type f -print | sort

          copy_asset() {
            local target="$1"
            local required="$2"
            local source
            shift 2

            source=""
            for pattern in "$@"; do
              source="$(find release-assets -type f -name "$pattern" | sort | head -n 1)"
              if [ -n "$source" ]; then
                break
              fi
            done

            if [ -z "$source" ]; then
              if [ "$required" = "required" ]; then
                echo "Required release asset not found for stable target: $target"
                echo "Tried patterns: $*"
                exit 1
              fi

              echo "Optional release asset not found for stable target: $target"
              echo "Tried patterns: $*"
              return 0
            fi

            cp "$source" "stable-release-assets/$target"
            echo "Prepared $target from $source"
          }

          copy_asset 'ABSONS-Meet-mac.dmg' required \
            'ABSONS-Meet-*-mac-universal.dmg' \
            'ABSONS-Meet-*-mac-*.dmg'
          copy_asset 'ABSONS-Meet-windows-x64.exe' required \
            'ABSONS-Meet-Setup-*-x64.exe'
          copy_asset 'ABSONS-Meet-linux-x64.AppImage' required \
            'ABSONS-Meet-*-linux-x86_64.AppImage' \
            'ABSONS-Meet-*-linux-x64.AppImage'

          copy_asset 'ABSONS-Meet-mac.zip' optional \
            'ABSONS-Meet-*-mac-universal.zip' \
            'ABSONS-Meet-*-mac-*.zip'
          copy_asset 'ABSONS-Meet-windows-arm64.exe' optional \
            'ABSONS-Meet-Setup-*-arm64.exe'
          copy_asset 'ABSONS-Meet-windows-ia32.exe' optional \
            'ABSONS-Meet-Setup-*-ia32.exe'
          copy_asset 'ABSONS-Meet-linux-arm64.AppImage' optional \
            'ABSONS-Meet-*-linux-arm64.AppImage'
          copy_asset 'ABSONS-Meet-linux-x64.deb' optional \
            'ABSONS-Meet-*-linux-amd64.deb' \
            'ABSONS-Meet-*-linux-x86_64.deb' \
            'ABSONS-Meet-*-linux-x64.deb'
          copy_asset 'ABSONS-Meet-linux-arm64.deb' optional \
            'ABSONS-Meet-*-linux-arm64.deb'

          echo "Stable release assets:"
          find stable-release-assets -maxdepth 1 -type f -print | sort

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          TITLE="ABSONS Meet ${VERSION} build ${GITHUB_RUN_NUMBER}"

          mapfile -t FILES < <(find stable-release-assets -type f | sort)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Deleting it before recreating assets for this run."
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --title "$TITLE" \
            --latest \
            --notes "Automated ABSONS Meet release build from master run ${GITHUB_RUN_NUMBER}."
